# A separate listener keeps the private dashboard on 443 inaccessible.
# Root secret and credentials never appear in a log or this configuration.
limit_req_zone $binary_remote_addr zone=spry_issuer_ip:1m rate=12r/m;
limit_req_zone $server_name zone=spry_issuer_global:1m rate=32r/m;
limit_conn_zone $binary_remote_addr zone=spry_issuer_connections:1m;

server {
    listen 95.216.164.146:7443 ssl default_server;
    listen [2a01:4f9:c014:971::1]:7443 ssl default_server;
    server_name demo.forgesworn.dev;
    ssl_certificate /etc/letsencrypt/live/demo.forgesworn.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.forgesworn.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    client_max_body_size 128;
    client_body_timeout 2s;
    client_header_timeout 2s;
    keepalive_timeout 5s;
    limit_conn spry_issuer_connections 4;
    limit_req_status 429;
    location = /turn-credentials {
        limit_req zone=spry_issuer_ip burst=12 nodelay;
        limit_req zone=spry_issuer_global burst=32 nodelay;
        proxy_pass http://127.0.0.1:7349;
        proxy_http_version 1.0;
        proxy_pass_request_headers off;
        proxy_set_header Host demo.forgesworn.dev;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Connection close;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 2s;
        proxy_cache off;
        proxy_redirect off;
    }
    location / { return 404; }
}
