name: spry
on:
  push:
    branches: ['**']
    paths: [apps/spry/**, Cargo.toml, Cargo.lock, PINS, .github/workflows/spry.yml]
  pull_request:
    paths: [apps/spry/**, Cargo.toml, Cargo.lock, PINS, .github/workflows/spry.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, cache: false, components: 'rustfmt,clippy' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  image:
    needs: verify
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image coordinates
        id: image
        run: |
          . ./PINS
          . scripts/lib/app-image.bash
          app_image spry
          echo "tag=$APP_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$APP_REF" >> "$GITHUB_OUTPUT"
      - name: Build native Rust package
        run: docker build --build-arg SPRY_REF=${{ steps.image.outputs.ref }} -f apps/spry/Dockerfile -t '${{ steps.image.outputs.tag }}-${{ matrix.arch }}' .
      - name: Confirm runtime contains no Node interpreter
        run: docker run --rm --entrypoint sh '${{ steps.image.outputs.tag }}-${{ matrix.arch }}' -c 'test -x /usr/local/bin/spry-node && test -x /usr/local/bin/spry-turn && ! command -v node'
      - name: Extract native relay for socket interop
        run: |
          docker create --name spry-extract '${{ steps.image.outputs.tag }}-${{ matrix.arch }}'
          docker cp spry-extract:/usr/local/bin/spry-turn "$RUNNER_TEMP/spry-turn"
          docker rm spry-extract
      - uses: actions/checkout@v4
        with:
          repository: forgesworn/spry-turn
          ref: 492eb708a282f666e6dcec550e4d94a1e56b9599
          path: .local/relay-source
      - name: Real native socket interop
        run: python3 .local/relay-source/tests/interop.py --binary "$RUNNER_TEMP/spry-turn" --tls
      - name: Publish immutable architecture image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tag='${{ steps.image.outputs.tag }}-${{ matrix.arch }}'
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if docker manifest inspect "$tag" >/dev/null 2>"$RUNNER_TEMP/registry-error"; then
            echo "Image already exists; bump SPRY_PKG_REV instead of replacing it" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/registry-error"; then
            cat "$RUNNER_TEMP/registry-error" >&2; exit 1
          fi
          docker push "$tag"
  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          . ./PINS
          . scripts/lib/app-image.bash
          app_image spry
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if docker manifest inspect "$APP_TAG" >/dev/null 2>"$RUNNER_TEMP/registry-error"; then
            echo "Image already exists; bump SPRY_PKG_REV instead of replacing it" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/registry-error"; then
            cat "$RUNNER_TEMP/registry-error" >&2; exit 1
          fi
          docker manifest create "$APP_TAG" "$APP_TAG-amd64" "$APP_TAG-arm64"
          docker manifest push "$APP_TAG"
