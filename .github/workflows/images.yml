name: images
on:
  push:
    paths: [apps/**, tests/smoke/**, PINS, .github/workflows/images.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  wildbloom-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: pin
        run: |
          . ./PINS
          echo "ref=$WILDBLOOM_NODE_REF" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/forgesworn/wildbloom-node:0.2.2-${WILDBLOOM_NODE_REF:0:7}" >> "$GITHUB_OUTPUT"
      - run: |
          grep -qF "${{ steps.pin.outputs.tag }}" apps/wildbloom-node/manifest.yml \
            || { echo "manifest image tag does not match PINS"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/wildbloom-node
          build-args: WILDBLOOM_NODE_REF=${{ steps.pin.outputs.ref }}
          load: true
          tags: ${{ steps.pin.outputs.tag }}
      - run: tests/smoke/wildbloom-node.sh "${{ steps.pin.outputs.tag }}"
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.pin.outputs.tag }}"
  wildbloom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          . ./PINS
          tag=$(grep -m1 -oE 'ghcr.io/forgesworn/wildbloom:[^[:space:]]+' apps/wildbloom/manifest.yml)
          case "$tag" in *"-${WILDBLOOM_REF:0:7}") ;; *) echo "manifest tag does not match PINS"; exit 1;; esac
          echo "ref=$WILDBLOOM_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/wildbloom
          build-args: WILDBLOOM_REF=${{ steps.pin.outputs.ref }}
          load: true
          tags: ${{ steps.pin.outputs.tag }}
      - run: tests/smoke/wildbloom.sh "${{ steps.pin.outputs.tag }}"
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.pin.outputs.tag }}"
