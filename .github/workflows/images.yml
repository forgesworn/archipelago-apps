name: images
on:
  push:
    # Branches only: a tag push would otherwise run every workflow again.
    branches: ['**']
    paths: [apps/**, tests/smoke/**, PINS, scripts/image-plan.sh, scripts/lib/app-image.bash, scripts/configure-wildbloom-sales.py, docs/wildbloom-sales.example.json, .github/workflows/images.yml]
  workflow_dispatch:
# Two runs must not both see a tag as unpublished and push it.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  wildbloom-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Ask the registry first, then the diff (see the script): an unpublished
      # tag is built and pushed; a published one is never replaced.
      - id: plan
        run: scripts/image-plan.sh wildbloom-node "${{ github.event.before }}" "${{ github.event_name }}"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.build == 'true'
        with: { node-version: "24" }
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build == 'true'
        with:
          # GitHub's shared Docker Hub egress can be rate-limited before a
          # build starts. BuildKit still verifies and uses the official image;
          # the mirror only supplies cached Docker Hub layers.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.build == 'true'
        with:
          context: apps/wildbloom-node
          build-args: WILDBLOOM_NODE_REF=${{ steps.plan.outputs.ref }}
          load: true
          tags: ${{ steps.plan.outputs.tag }}
      - if: steps.plan.outputs.build == 'true'
        run: tests/smoke/wildbloom-node.sh "${{ steps.plan.outputs.tag }}" ghcr.io/forgesworn/wildbloom-node:0.2.2-b3b254b-2
      - if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-yaml
          node tests/smoke/seller-capacity.mjs "${{ steps.plan.outputs.tag }}"
      - if: steps.plan.outputs.push == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.plan.outputs.tag }}"
  wildbloom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # Ask the registry first, then the diff (see the script): an unpublished
      # tag is built and pushed; a published one is never replaced.
      - id: plan
        run: scripts/image-plan.sh wildbloom "${{ github.event.before }}" "${{ github.event_name }}"
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build == 'true'
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.build == 'true'
        with:
          context: apps/wildbloom
          build-args: WILDBLOOM_REF=${{ steps.plan.outputs.ref }}
          load: true
          tags: ${{ steps.plan.outputs.tag }}
      - if: steps.plan.outputs.build == 'true'
        run: |
          npm ci --prefix tests/smoke --ignore-scripts
          cd tests/smoke && npx playwright-core install --with-deps chromium
          cd ../.. && tests/smoke/wildbloom.sh "${{ steps.plan.outputs.tag }}"
      - if: steps.plan.outputs.push == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.plan.outputs.tag }}"
