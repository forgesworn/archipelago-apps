name: validate
on:
  push:
    # Branches only: a tag push would otherwise run every workflow again.
    branches: ['**']
  pull_request:
jobs:
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, cache: false }
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - run: python3 tests/test-sales-config.py
      - run: scripts/fetch-archy.sh
      - run: scripts/apply-patches.sh
      - run: scripts/validate.sh
