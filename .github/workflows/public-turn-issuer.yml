name: public-turn-issuer
on:
  push:
    branches: ['**']
    paths: [operator/turn-issuer/**, .github/workflows/public-turn-issuer.yml]
  pull_request:
    paths: [operator/turn-issuer/**, .github/workflows/public-turn-issuer.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, cache: false, components: 'rustfmt,clippy' }
      - run: cargo fmt --manifest-path operator/turn-issuer/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path operator/turn-issuer/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path operator/turn-issuer/Cargo.toml
      - run: python3 -m py_compile operator/turn-issuer/refill.py
