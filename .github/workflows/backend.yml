name: backend
on:
  push:
    # Branches only: a tag push would otherwise run every workflow again.
    branches: ['**']
    paths:
      - upstream/patches/**
      - PINS
      - scripts/fetch-archy.sh
      - scripts/apply-patches.sh
      - scripts/backend-inputs.sh
      - scripts/lib/patches.bash
      - scripts/backend-release-plan.sh
      - .github/workflows/backend.yml
  workflow_dispatch:
# One run at a time per ref: two runs must not both find no release and publish.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A published backend binary is never replaced: builds are not
      # bit-reproducible, so a node's copy would stop matching the published
      # sha. When a push left the build inputs unchanged and the release
      # already records the same inputs, there is nothing to test or publish.
      - id: plan
        env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/backend-release-plan.sh "${{ github.event.before }}" "${{ github.event_name }}" >> "$GITHUB_OUTPUT"
      # The action defaults RUSTFLAGS to -D warnings; build upstream with its own lint settings.
      # No cache: the workspace (.cache/archy/core) does not exist until the next step.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.plan.outputs.skip != 'true'
        with: { toolchain: stable, rustflags: "", cache: false }
      - if: steps.plan.outputs.skip != 'true'
        run: ARCHY_FULL=1 scripts/fetch-archy.sh
      - if: steps.plan.outputs.skip != 'true'
        run: scripts/apply-patches.sh
      # Plain cargo test: this crate has no host-operation tests, and its
      # lan_address tests find apps/ through CARGO_MANIFEST_DIR, which only cargo sets.
      - name: Container tests
        if: steps.plan.outputs.skip != 'true'
        working-directory: .cache/archy
        run: cargo test --manifest-path core/Cargo.toml -p archipelago-container --locked
      # Plain cargo test (default features, as the harness uses): several tests
      # read the real apps/*/manifest.yml through CARGO_MANIFEST_DIR, which the
      # harness does not set. --exact makes each --skip match one full test path.
      # Host-operation tests, run in the next step under upstream's harness:
      #   install_* (3) and manifest_generated_files_* (2).
      # Skipped, both unrelated to the patch (see docs/upstream-notes.md):
      # - quadlet: the runner's Podman 4.9 generator predates StopTimeout;
      #   Archipelago targets Debian 13's Podman 5.
      # - wallet ordering: reads the node's real Bitcoin RPC secret, which no
      #   CI host has.
      - name: Archipelago tests
        if: steps.plan.outputs.skip != 'true'
        working-directory: .cache/archy
        run: >-
          cargo test --manifest-path core/Cargo.toml -p archipelago --locked -- --exact
          --skip container::prod_orchestrator::tests::install_applies_data_uid_chown_before_create
          --skip container::prod_orchestrator::tests::install_resolves_derived_and_secret_env_before_create
          --skip container::prod_orchestrator::tests::install_writes_manifest_generated_files_before_create
          --skip container::prod_orchestrator::tests::manifest_generated_files_can_overwrite_when_declared
          --skip container::prod_orchestrator::tests::manifest_generated_files_do_not_overwrite_by_default
          --skip container::quadlet::tests::actual_quadlet_generator_stops_before_forced_removal
          --skip container::prod_orchestrator::tests::reconcile_wallet_start_precedes_unrelated_failed_image_pull
      # Upstream's harness gives these a private /var/lib/archipelago. Only they
      # run here; the count check fails the step if a rename leaves it vacuous.
      - name: Host-operation tests (isolated)
        if: steps.plan.outputs.skip != 'true'
        working-directory: .cache/archy
        run: |
          scripts/test-backend-isolated.sh --exact \
            container::prod_orchestrator::tests::install_applies_data_uid_chown_before_create \
            container::prod_orchestrator::tests::install_resolves_derived_and_secret_env_before_create \
            container::prod_orchestrator::tests::install_writes_manifest_generated_files_before_create \
            container::prod_orchestrator::tests::manifest_generated_files_can_overwrite_when_declared \
            container::prod_orchestrator::tests::manifest_generated_files_do_not_overwrite_by_default \
            | tee "$RUNNER_TEMP/host-ops.log"
          grep -q 'test result: ok. 5 passed;' "$RUNNER_TEMP/host-ops.log"
      # Our patch's tests, by exact name: a rename gives "0 passed" and fails.
      - name: Patch tests (NODE_IDENTITY_PUBKEYS)
        if: steps.plan.outputs.skip != 'true'
        working-directory: .cache/archy
        run: |
          cargo test --manifest-path core/Cargo.toml -p archipelago-container --locked --lib -- --exact \
            manifest::tests::node_identity_pubkeys_placeholder_is_accepted \
            manifest::tests::resolve_derived_env_renders_node_identity_pubkeys | tee "$RUNNER_TEMP/container.log"
          grep -q 'test result: ok. 2 passed;' "$RUNNER_TEMP/container.log"
          cargo test --manifest-path core/Cargo.toml -p archipelago --locked --bin archipelago -- --exact \
            identity_manager::tests::is_node_identity_matches_only_the_node_pubkey \
            identity_manager::tests::is_hidden_from_app_signer_mirrors_the_picker_rules \
            identity_manager::tests::app_signable_nostr_pubkeys_mirror_the_identity_picker \
            identity_manager::tests::app_signable_nostr_pubkeys_is_empty_with_only_the_node_identity \
            container::prod_orchestrator::tests::node_identity_pubkeys_placeholder_renders_the_signable_identities \
            container::prod_orchestrator::tests::node_identity_pubkeys_placeholder_refuses_an_empty_set \
            container::prod_orchestrator::tests::node_identity_pubkeys_placeholder_needs_the_node_key_and_never_creates_it | tee "$RUNNER_TEMP/archipelago.log"
          grep -q 'test result: ok. 7 passed;' "$RUNNER_TEMP/archipelago.log"
      # Linked signers and signer login (patches 0003-0006), one module
      # filter at a time (filters are substring matches: signer_login::tests::
      # also counts api::rpc::signer_login::tests::). Each count covers the whole module, upstream's tests
      # included, so a dropped or renamed test changes it. Re-count after an
      # ARCHY_REF bump.
      - name: Patch tests (linked signers)
        if: steps.plan.outputs.skip != 'true'
        working-directory: .cache/archy
        run: |
          check() {
            cargo test --manifest-path core/Cargo.toml -p archipelago --locked --bin archipelago -- "$1" \
              | tee "$RUNNER_TEMP/patch.log"
            grep -q "test result: ok. $2 passed; 0 failed" "$RUNNER_TEMP/patch.log" \
              || { echo "::error::$1: expected $2 passed"; exit 1; }
          }
          check remote_signer::tests:: 39
          check identity_manager::tests:: 33
          check api::rpc::nostr_signing_origin_tests:: 3
          check api::rpc::middleware::sanitize_tests:: 10
          check rate_limit::tests:: 10
          check api::rpc::identity::handlers::tests:: 2
          check signer_login::tests:: 49
          check api::rpc::signer_login::tests:: 3
          check api::rpc::signer_login_tests:: 17
          check appgate::identity::tests:: 11
          check auth::tests:: 15
          check public_host 7
      - name: Build backend
        if: steps.plan.outputs.skip != 'true'
        working-directory: .cache/archy/core
        run: cargo build --release -p archipelago
      - name: Publish release asset
        if: steps.plan.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          . ./PINS
          tag="backend-${ARCHY_RELEASE}-p${BACKEND_PATCH_LEVEL}"
          bin=.cache/archy/core/target/release/archipelago
          sha256sum "$bin" | awk '{print $1"  archipelago"}' > archipelago.sha256
          # Builds are not bit-reproducible, so guard on the inputs instead: a
          # tag may only be built from one archy pin and set of patches, and
          # once published it is never replaced (a node's installed binary
          # would stop matching the published sha). Only the ARCHY_* lines of
          # PINS count, so Wildbloom pin bumps do not matter.
          scripts/backend-inputs.sh > inputs.sha256
          if gh release view "$tag" >/dev/null 2>&1; then
            # Published: never upload to it again. Without a readable record
            # of its inputs we cannot show it matches, so stop.
            prev=$(mktemp -d)
            gh release download "$tag" -p inputs.sha256 -D "$prev" \
              || { echo "::error::$tag exists but its inputs.sha256 cannot be downloaded; not replacing it. Bump BACKEND_PATCH_LEVEL"; exit 1; }
            if cmp -s "$prev/inputs.sha256" inputs.sha256; then
              echo "::notice::$tag is already published from these inputs; not replacing its binary or sha"
              exit 0
            fi
            echo "::error::$tag was built from a different archy pin or patches; bump BACKEND_PATCH_LEVEL"
            exit 1
          fi
          gh release create "$tag" --title "$tag" \
            --notes "Archipelago ${ARCHY_RELEASE} backend with upstream/patches applied (test-node use)."
          # inputs.sha256 goes last, so its presence implies the binary and sha landed.
          gh release upload "$tag" "$bin" archipelago.sha256 inputs.sha256
