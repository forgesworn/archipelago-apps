name: backend
on:
  push:
    paths: [upstream/patches/**, PINS, .github/workflows/backend.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The action defaults RUSTFLAGS to -D warnings; build upstream with its own lint settings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, rustflags: "" }
      - run: ARCHY_FULL=1 scripts/fetch-archy.sh
      - run: scripts/apply-patches.sh
      # Upstream's own harness: unit tests run under systemd-run with a private
      # /var/lib/archipelago, as host-operation tests require.
      - name: Container tests (isolated)
        working-directory: .cache/archy
        run: ARCHY_TEST_PACKAGE=archipelago-container scripts/test-backend-isolated.sh
      # Skipped, both unrelated to the patch (see docs/upstream-notes.md):
      # - the runner's Podman 4.9 quadlet generator predates StopTimeout;
      #   Archipelago targets Debian 13's Podman 5.
      # - the wallet-ordering test reads the node's real Bitcoin RPC secret,
      #   which no isolated (or CI) host has.
      - name: Archipelago tests (isolated)
        working-directory: .cache/archy
        run: >-
          scripts/test-backend-isolated.sh
          --skip container::quadlet::tests::actual_quadlet_generator_stops_before_forced_removal
          --skip container::prod_orchestrator::tests::reconcile_wallet_start_precedes_unrelated_failed_image_pull
      - name: Patch tests (NODE_NOSTR_PUBKEY)
        working-directory: .cache/archy
        run: |
          ARCHY_TEST_PACKAGE=archipelago-container scripts/test-backend-isolated.sh node_nostr_pubkey | tee "$RUNNER_TEMP/container.log"
          grep -q 'test result: ok. 2 passed' "$RUNNER_TEMP/container.log"
          scripts/test-backend-isolated.sh node_nostr_pubkey | tee "$RUNNER_TEMP/archipelago.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/archipelago.log"
      - name: Build backend
        working-directory: .cache/archy/core
        run: cargo build --release -p archipelago
      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          . ./PINS
          tag="backend-${ARCHY_RELEASE}-p${BACKEND_PATCH_LEVEL}"
          bin=.cache/archy/core/target/release/archipelago
          sha256sum "$bin" | awk '{print $1"  archipelago"}' > archipelago.sha256
          # Builds are not bit-reproducible, so guard on the inputs instead: a
          # tag may only be rebuilt from the same archy pin and patches. Only
          # the ARCHY_* lines of PINS count, so Wildbloom pin bumps still pass.
          { grep -E '^(ARCHY_REPO|ARCHY_REF|ARCHY_RELEASE)=' PINS; sha256sum upstream/patches/*.patch; } \
            | sha256sum | awk '{print $1}' > inputs.sha256
          if gh release view "$tag" >/dev/null 2>&1; then
            prev=$(mktemp -d)
            if gh release download "$tag" -p inputs.sha256 -D "$prev" && \
               ! cmp -s "$prev/inputs.sha256" inputs.sha256; then
              echo "::error::$tag was built from a different archy pin or patches; bump BACKEND_PATCH_LEVEL"
              exit 1
            fi
          else
            gh release create "$tag" --title "$tag" \
              --notes "Archipelago ${ARCHY_RELEASE} backend with upstream/patches applied (test-node use)."
          fi
          gh release upload "$tag" "$bin" archipelago.sha256 inputs.sha256 --clobber
