name: backend
on:
  push:
    paths: [upstream/patches/**, PINS, .github/workflows/backend.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The action defaults RUSTFLAGS to -D warnings; build upstream with its own lint settings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: stable, rustflags: "" }
      - run: ARCHY_FULL=1 scripts/fetch-archy.sh
      - run: scripts/apply-patches.sh
      # Plain cargo test: this crate has no host-operation tests, and its
      # lan_address tests find apps/ through CARGO_MANIFEST_DIR, which only cargo sets.
      - name: Container tests
        working-directory: .cache/archy
        run: cargo test --manifest-path core/Cargo.toml -p archipelago-container --locked
      # Plain cargo test (default features, as the harness uses): several tests
      # read the real apps/*/manifest.yml through CARGO_MANIFEST_DIR, which the
      # harness does not set. --exact makes each --skip match one full test path.
      # Host-operation tests, run in the next step under upstream's harness:
      #   install_* (3) and manifest_generated_files_* (2).
      # Skipped, both unrelated to the patch (see docs/upstream-notes.md):
      # - quadlet: the runner's Podman 4.9 generator predates StopTimeout;
      #   Archipelago targets Debian 13's Podman 5.
      # - wallet ordering: reads the node's real Bitcoin RPC secret, which no
      #   CI host has.
      - name: Archipelago tests
        working-directory: .cache/archy
        run: >-
          cargo test --manifest-path core/Cargo.toml -p archipelago --locked -- --exact
          --skip container::prod_orchestrator::tests::install_applies_data_uid_chown_before_create
          --skip container::prod_orchestrator::tests::install_resolves_derived_and_secret_env_before_create
          --skip container::prod_orchestrator::tests::install_writes_manifest_generated_files_before_create
          --skip container::prod_orchestrator::tests::manifest_generated_files_can_overwrite_when_declared
          --skip container::prod_orchestrator::tests::manifest_generated_files_do_not_overwrite_by_default
          --skip container::quadlet::tests::actual_quadlet_generator_stops_before_forced_removal
          --skip container::prod_orchestrator::tests::reconcile_wallet_start_precedes_unrelated_failed_image_pull
      # Upstream's harness gives these a private /var/lib/archipelago. Only they
      # run here; the count check fails the step if a rename leaves it vacuous.
      - name: Host-operation tests (isolated)
        working-directory: .cache/archy
        run: |
          scripts/test-backend-isolated.sh --exact \
            container::prod_orchestrator::tests::install_applies_data_uid_chown_before_create \
            container::prod_orchestrator::tests::install_resolves_derived_and_secret_env_before_create \
            container::prod_orchestrator::tests::install_writes_manifest_generated_files_before_create \
            container::prod_orchestrator::tests::manifest_generated_files_can_overwrite_when_declared \
            container::prod_orchestrator::tests::manifest_generated_files_do_not_overwrite_by_default \
            | tee "$RUNNER_TEMP/host-ops.log"
          grep -q 'test result: ok. 5 passed;' "$RUNNER_TEMP/host-ops.log"
      # Our patch's tests, by exact name: a rename gives "0 passed" and fails.
      - name: Patch tests (NODE_NOSTR_PUBKEY)
        working-directory: .cache/archy
        run: |
          cargo test --manifest-path core/Cargo.toml -p archipelago-container --locked --lib -- --exact \
            manifest::tests::node_nostr_pubkey_placeholder_is_accepted \
            manifest::tests::resolve_derived_env_renders_node_nostr_pubkey | tee "$RUNNER_TEMP/container.log"
          grep -q 'test result: ok. 2 passed;' "$RUNNER_TEMP/container.log"
          cargo test --manifest-path core/Cargo.toml -p archipelago --locked --bin archipelago -- --exact \
            container::prod_orchestrator::tests::node_nostr_pubkey_placeholder_renders_the_node_key | tee "$RUNNER_TEMP/archipelago.log"
          grep -q 'test result: ok. 1 passed;' "$RUNNER_TEMP/archipelago.log"
      - name: Build backend
        working-directory: .cache/archy/core
        run: cargo build --release -p archipelago
      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          . ./PINS
          tag="backend-${ARCHY_RELEASE}-p${BACKEND_PATCH_LEVEL}"
          bin=.cache/archy/core/target/release/archipelago
          sha256sum "$bin" | awk '{print $1"  archipelago"}' > archipelago.sha256
          # Builds are not bit-reproducible, so guard on the inputs instead: a
          # tag may only be rebuilt from the same archy pin and patches. Only
          # the ARCHY_* lines of PINS count, so Wildbloom pin bumps still pass.
          { grep -E '^(ARCHY_REPO|ARCHY_REF|ARCHY_RELEASE)=' PINS; sha256sum upstream/patches/*.patch; } \
            | sha256sum | awk '{print $1}' > inputs.sha256
          if gh release view "$tag" >/dev/null 2>&1; then
            prev=$(mktemp -d)
            if gh release download "$tag" -p inputs.sha256 -D "$prev" && \
               ! cmp -s "$prev/inputs.sha256" inputs.sha256; then
              echo "::error::$tag was built from a different archy pin or patches; bump BACKEND_PATCH_LEVEL"
              exit 1
            fi
          else
            gh release create "$tag" --title "$tag" \
              --notes "Archipelago ${ARCHY_RELEASE} backend with upstream/patches applied (test-node use)."
          fi
          gh release upload "$tag" "$bin" archipelago.sha256 inputs.sha256 --clobber
