app:
  id: spry
  name: Spry
  version: 0.1.0
  description: Pair once with KithMoot to share your node’s call relay automatically with the people in your calls.
  category: networking
  container:
    image: ghcr.io/forgesworn/spry:0.1.0-2efb051-2
    pull_policy: if-not-present
    network: host
    generated_secrets:
      - { name: spry-turn-rest-secret, kind: hex32 }
    secret_env:
      - { key: SPRY_TURN_SECRET, secret_file: spry-turn-rest-secret }
    derived_env:
      - { key: SPRY_OWNER_URL, template: 'https://{{HOST_MDNS}}:3744' }
      - { key: SPRY_RELAY_IP, template: '{{HOST_IP}}' }
      - { key: SPRY_PEER_NAME, template: '{{MESH_HOST}}' }
      - { key: SPRY_OWNER_KEYS, template: '{{NODE_IDENTITY_PUBKEYS}}' }
      - { key: SPRY_DASHBOARD_ORIGINS, template: 'https://{{HOST_IP}},https://{{HOST_MDNS}},https://{{HOST_IP}}:3744,https://{{HOST_MDNS}}:3744' }
  environment: ["SPRY_PEER_INTERFACE=fips0", "SPRY_PEER_RESOLVER=127.0.0.1:5354", "SPRY_PEER_ZONE=fips", "SPRY_TLS_GATE=true", "SPRY_ALLOWED_ORIGINS=https://kithmoot.app,https://kithmoot.forgesworn.dev"]
  resources:
    memory_limit: 128m
    cpu_limit: 1
  security:
    capabilities: []
    readonly_root: true
    no_new_privileges: true
    network_policy: host
  volumes:
    - { type: bind, source: /var/lib/archipelago/spry, target: /data, options: [rw] }
  ports:
    - { host: 3744, container: 3744, protocol: tcp, bind: 127.0.0.1, auth: open, auth_rationale: 'Public pairing UI and body-bound signed API. Pairing requires a node identity; call credentials require an unexpired room capability. No anonymous credential issuer.' }
    - { host: 3478, container: 3478, protocol: udp, auth: none, auth_rationale: 'Native TURN authenticates short-lived per-device credentials. HTTP gates cannot proxy TURN.' }
    - { host: 3478, container: 3478, protocol: tcp, auth: none, auth_rationale: 'Native TURN authenticates short-lived per-device credentials. HTTP gates cannot proxy TURN.' }
    - { host: 5349, container: 3478, protocol: tcp, bind: 127.0.0.1, auth: open, auth_rationale: "Native TURN-over-TLS uses the host certificate and forwards only to this node’s authenticated Spry listener." }
  interfaces:
    main:
      name: Pair with KithMoot
      description: Pair once, then call normally.
      type: ui
      port: 3744
      protocol: http
      path: /
  metadata:
    author: ForgeSworn
    license: MIT
    repo: https://github.com/forgesworn/archipelago-apps
    tags: [calls, turn, kithmoot]
