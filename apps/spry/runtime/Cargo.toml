[package]
name = "spry-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
authors = ["TheCryptoDonkey"]
description = "Owner-controlled Spry pairing and short-lived call access for Archipelago"

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
getrandom = "=0.3.4"
hmac = "=0.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "signal", "process", "io-util", "macros"] }
url = "=2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
