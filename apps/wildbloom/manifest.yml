app:
  id: wildbloom
  name: Wildbloom
  version: 0.0.1
  upstream:
    kind: github
    repo: forgesworn/wildbloom
  description: Encrypt files, keep replicas or recoverable shards, and recover from saved receipts. Discover trusted nodes, buy storage directly from participating operators and verify stored bytes, signed by your node identities.
  category: nostr

  container:
    image: ghcr.io/forgesworn/wildbloom:0.0.1-fa2877d-2
    pull_policy: if-not-present
    network: archy-net

  dependencies:
    - app_id: wildbloom-node

  resources:
    memory_limit: 64Mi
    cpu_limit: 1

  security:
    capabilities: [CHOWN, SETGID, SETUID]
    # nginx writes its pid and cache under /var, and post_install refreshes the
    # node's provider in the web root, so the root filesystem must be writable.
    readonly_root: false
    no_new_privileges: true
    network_policy: isolated

  ports:
    - host: 3743
      container: 3743
      protocol: tcp
      bind: 127.0.0.1
      auth: gated

  environment: []

  # The image bakes Archipelago's provider at the pinned version; that copy is
  # the baseline and survives the health monitor recreating the container,
  # which does not re-run post_install. This hook refreshes it to the node's
  # current copy (kept up to date by frontend OTA) after install, as IndeeHub does.
  hooks:
    post_install:
      - copy_from_host:
          src: "web-ui/nostr-provider.js"
          dest: "/usr/share/nginx/html/nostr-provider.js"

  health_check:
    type: http
    endpoint: http://localhost:3743
    path: /
    interval: 30s
    timeout: 5s
    retries: 3

  interfaces:
    main:
      name: Web UI
      description: Encrypt, publish and recover files using your node identities
      type: ui
      port: 3743
      protocol: http
      path: /#client

  metadata:
    author: ForgeSworn
    website: https://github.com/forgesworn/wildbloom
    repo: https://github.com/forgesworn/wildbloom
    license: MIT
    tags: [nostr, blossom, storage, encryption]
