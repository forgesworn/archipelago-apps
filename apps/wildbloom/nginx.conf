server {
    listen 3743;
    # Archipelago's health check requests http://localhost:3743/, and localhost
    # resolves to ::1 in the container. The entrypoint script drops this line
    # when the container has no IPv6.
    listen [::]:3743;
    root /usr/share/nginx/html;

    # Archipelago's NIP-07 provider, copied from the node at install time.
    location = /nostr-provider.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/nostr-provider.js?v=tab-signer-v4"></script></head>';
    }
}
