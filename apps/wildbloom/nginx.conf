server {
    listen 3743;
    # Archipelago's health check requests http://localhost:3743/, and localhost
    # resolves to ::1 in the container. The entrypoint script drops this line
    # when the container has no IPv6.
    listen [::]:3743;
    root /usr/share/nginx/html;

    # Archipelago's NIP-07 provider: baked into the image, refreshed from the node
    # at install time.
    location = /nostr-provider.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # Wildbloom has no same-origin API. The injected provider probes this
    # namespace before optional NIP-98 login; SPA HTML with status 200 would
    # otherwise trigger an unnecessary signature and session-storage attempt.
    location /api/ {
        return 404;
    }

    # The pairing pages, served as Wildbloom's own production server does:
    # only at /get and /send, a trailing slash redirects, and the file names are
    # not reachable. Without these, the SPA fallback would answer with the main
    # client. They do not use a signer, so nothing is injected into them.
    location = /get { try_files /get.html =404; }
    location = /send { try_files /send.html =404; }
    location = /get/ { absolute_redirect off; return 301 /get; }
    location = /send/ { absolute_redirect off; return 301 /send; }
    location = /get.html { return 404; }
    location = /send.html { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/nostr-provider.js?v=tab-signer-v4"></script><script src="/archipelago-config.js"></script><script src="/archipelago-node.js"></script></head>';
    }

    location = /archipelago-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
