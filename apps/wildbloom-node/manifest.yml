app:
  id: wildbloom-node
  name: Wildbloom Node
  version: 0.3.5
  upstream:
    kind: github
    repo: forgesworn/wildbloom-node
  description: Blossom storage for encrypted files and shards, owned by your node identities. Only your node identities can upload; anyone who can reach the node and knows a file's hash can read it, as with any Blossom server, so encrypt private files before upload.
  category: nostr

  container:
    image: ghcr.io/forgesworn/wildbloom-node:0.3.5-bee5383-2
    pull_policy: if-not-present
    network: archy-net
    derived_env:
      - key: WILDBLOOM_ALLOW_PUBKEYS
        template: "{{NODE_IDENTITY_PUBKEYS}}"
      - key: WILDBLOOM_PUBLIC_URL
        template: "https://{{PUBLIC_HOST}}:3742"
      - key: WILDBLOOM_SERVER_NAME
        template: "{{HOST_IP}},{{HOST_MDNS}},{{PUBLIC_HOST}}"

  dependencies:
    - storage: 10Gi

  resources:
    memory_limit: 256Mi
    cpu_limit: 1

  security:
    capabilities: []
    readonly_root: true
    no_new_privileges: true
    network_policy: isolated

  ports:
    - host: 3742
      container: 3742
      protocol: tcp
      bind: 127.0.0.1
      auth: open
      auth_rationale: Blossom server with its own Nostr authorisation. Uploads, mirrors and deletes need an event signed by one of your node identities; listings need the lister's own signature; reads are by SHA-256 as the protocol intends. Blossom clients send no cookies, so a dashboard challenge would refuse every one of them. No node credentials are reachable.

  volumes:
    - type: bind
      source: /var/lib/archipelago/wildbloom-node
      target: /data
      options: [rw]

  # Full-read audits are opt-in because they consume disk and download bandwidth.
  # Paid storage stays off unless an operator provisions a private checkout profile.
  environment:
    - WILDBLOOM_STORAGE_PROOFS=false

  health_check:
    type: http
    endpoint: http://localhost:3742
    path: /healthz
    interval: 30s
    timeout: 5s
    retries: 3

  metadata:
    author: ForgeSworn
    website: https://github.com/forgesworn/wildbloom-node
    repo: https://github.com/forgesworn/wildbloom-node
    license: MIT
    tags: [nostr, blossom, storage, encryption]
